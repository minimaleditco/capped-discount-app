# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "Capped Discount & COD Fee"
client_id = "2c334cb8162a93e88de39958c51ff783"
application_url = "https://capped-discount-app.onrender.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_discounts,read_discounts,write_orders,read_orders,write_draft_orders,read_draft_orders,read_fulfillments,read_products,read_customers"

[auth]
redirect_urls = [
  "https://capped-discount-app.onrender.com/auth/callback",
  "https://capped-discount-app.onrender.com/auth/shopify/callback",
  "https://capped-discount-app.onrender.com/api/auth/callback"
]

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled", "orders/create", "fulfillments/create", "fulfillments/update" ]
  uri = "/webhooks"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks"

[build]
automatically_update_urls_on_dev = false
